<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/output.css" />
</head>
<body>
  <div class="desktop-stage">
  <div class="app-frame">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <span>Skill Tester</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">General</div>
        <button class="nav-item active" data-page="validate">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span data-i18n="nav_validate">Validate</span>
        </button>
        <button class="nav-item" data-page="matcher">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span data-i18n="nav_matcher">Matcher</span>
        </button>
        <button class="nav-item" data-page="coverage">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          <span data-i18n="nav_coverage">Coverage</span>
        </button>
        <button class="nav-item" data-page="llm">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span data-i18n="nav_llm">LLM Dry-Run</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-label">Workspace</div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
          <div class="dir-display" id="current-dir" style="flex:1;" data-i18n-default="no_dir">No directory loaded</div>
          <span id="watch-indicator" style="display:none;width:8px;height:8px;border-radius:50%;background:var(--color-pass);flex-shrink:0;" title="Watching for changes"></span>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary sidebar-action" style="flex:1;" id="btn-pick-dir" data-i18n="btn_open_dir">Open Dir</button>
          <button class="btn sidebar-action" style="flex:1;" id="btn-pick-file" data-i18n="btn_open_file">Open File</button>
        </div>
        <span class="sidebar-version" id="app-version">v0.2.0</span>
      </div>
    </aside>

    <!-- Main area: topbar + content -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-heading">
          <span class="topbar-title" id="topbar-title" data-i18n="nav_validate">Validate</span>
          <span class="topbar-kicker">Offline skill validation lab</span>
        </div>
        <div class="topbar-controls">
          <button class="btn btn-sm btn-ghost" id="btn-lang-en" style="font-size:11px;padding:3px 8px;">EN</button>
          <span style="font-size:11px;color:var(--color-text-muted);">|</span>
          <button class="btn btn-sm btn-ghost" id="btn-lang-th" style="font-size:11px;padding:3px 8px;">TH</button>
          <button class="btn btn-sm btn-ghost" id="btn-check-update" style="font-size:11px;" data-i18n="btn_check_update">Check Update</button>
          <button class="theme-toggle" id="btn-theme" title="Toggle theme">
            <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
        </div>
      </header>
      <main class="content-area">
        <div id="page-validate" class="page active"></div>
        <div id="page-matcher" class="page"></div>
        <div id="page-coverage" class="page"></div>
        <div id="page-llm" class="page"></div>
      </main>
    </div>
  </div>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/coverage.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
